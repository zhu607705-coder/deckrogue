<!DOCTYPE html>
<html>
<head>
    <title>Node Click Diagnostic</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #1a1a1a; color: #d4d4d8; }
        .log { margin: 5px 0; padding: 5px; background: #2a2a2a; border-radius: 4px; }
        .error { color: #ef4444; }
        .success { color: #10b981; }
        .warn { color: #fbbf24; }
    </style>
</head>
<body>
    <h1>地图节点点击诊断工具</h1>
    <div id="logs"></div>
    <script>
        const logs = document.getElementById('logs');
        function log(msg, type = 'info') {
            const div = document.createElement('div');
            div.className = `log ${type}`;
            div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            logs.appendChild(div);
        }

        // 模拟测试流程
        log('开始诊断...', 'success');

        // 测试1: 检查游戏状态
        log('测试1: 检查游戏状态变量');
        log('  - currentNodeId: 应为 null (游戏刚开始)');
        log('  - pendingNodeResolution: 应为 false');
        log('  - map: 应已生成');

        // 测试2: 检查节点可选择性
        log('测试2: 检查节点可选择性逻辑');
        log('  - isNodeSelectable 函数逻辑:');
        log('    1. pendingNodeResolution === false ?');
        log('    2. currentNodeId === null ?');
        log('    3. 如果为null, 检查 node.y === 0');
        log('    4. 节点在第0层时应返回 true');

        // 测试3: 检查点击处理
        log('测试3: 检查点击处理流程');
        log('  - 按钮 onClick: engine.enterNode(node.id)');
        log('  - enterNode -> moveToNode');
        log('  - moveToNode -> runFlowManager.moveToNode');
        log('  - runFlowManager.moveToNode -> canMoveToNode + moveToNodeLegacy');

        // 测试4: 常见问题
        log('测试4: 常见问题排查', 'warn');
        log('  - 问题A: renderModel 是否存在且覆盖了 availableNodeIds?', 'warn');
        log('  - 问题B: currentNodeId 是否在角色选择后被正确设置为null?', 'warn');
        log('  - 问题C: 地图生成后节点是否正确连接?', 'warn');

        log('诊断完成。请在浏览器控制台查看实际游戏状态。', 'success');
    </script>
</body>
</html>
