[project]
name = "deckrogue-rules-core"
version = "0.1.0"
description = "Python rules-core scaffold for DeckRogue runtime v2"
requires-python = ">=3.12"
dependencies = [
  "msgspec>=0.18.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.5",
  "hypothesis>=6.130.0",
  "ruff>=0.11.0",
  "mypy>=1.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
